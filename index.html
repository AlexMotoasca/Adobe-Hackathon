<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    // Keep assets rooted correctly when a nested SPA URL is opened directly.
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      const base = document.createElement('base');
      base.href = '/';
      document.head.appendChild(base);
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindMarket — AI feedback for your ads</title>
  <meta name="description" content="Upload an image or video ad and get feedback from five audience psychologies: what works, what doesn't, and how to market it better." />

  <!-- Google Fonts: Space Grotesk & Inter Tight (PolySans substitutes), Inter, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400&display=swap" rel="stylesheet" />

  <!-- Ventriloc Design System Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />

  <!-- Favicon SVG (Ember Dot Minimal) -->
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
<link rel="stylesheet" href="/css/live.css" /></head>
<body>
  <div id="app">
    <!-- Rendered dynamically by Router -->
  </div>

  <!-- Standalone Browser Bundle (Runs on both file:// and http://) -->

</body>
</html>
